  <!-- Runs before paint: shared theme (cookie across *.michelesettepani.dev, localStorage fallback). -->
  <script>
    (function () {
      var KEY = "pb-theme";
      function cookie() {
        var m = document.cookie.match(/(?:^|;\s*)pb-theme=(dark|light)/);
        return m ? m[1] : null;
      }
      function saved() {
        try { return cookie() || localStorage.getItem(KEY); } catch (e) { return cookie(); }
      }
      var mql = window.matchMedia("(prefers-color-scheme: dark)");
      function apply(theme) {
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.getElementById("theme-color");
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0f0f10" : "#fcfbf9");
      }
      apply(saved() || (mql.matches ? "dark" : "light"));
      mql.addEventListener("change", function () {
        if (!saved()) apply(mql.matches ? "dark" : "light");
      });
    })();
  </script>
</head>
